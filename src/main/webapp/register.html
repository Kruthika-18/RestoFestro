<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Register - RestoFestro</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500;1,600&family=Jost:wght@400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
<div class="auth-page">
    <div class="auth-card">
        <a href="home.html" class="logo"><span class="logo__name">RestoFestro</span><span class="logo__tag">Taste the Traditions of South India</span></a>
        <p class="tagline">Create an account to start ordering.</p>

        <form action="register" method="post" onsubmit="return validateForm()">
            <label>Name</label>
            <input type="text" id="name" name="name" required>

            <label>Email</label>
            <input type="email" id="email" name="email" required>

            <label>Phone</label>
            <input type="text" id="phone" name="phone" required>

            <label>Password</label>
            <input type="password" id="password" name="password" required>

            <label>Confirm Password</label>
            <input type="password" id="confirmPassword" name="confirmPassword" required>

            <p id="errorMsg" class="error-msg"></p>

            <button type="submit" class="btn btn--gold">Register</button>
        </form>

        <p class="auth-footer">Already have an account? <a href="login.html">Login here</a></p>
    </div>
</div>
<script src="js/register.js"></script>
</body>
</html>
