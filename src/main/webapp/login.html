<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Login - RestoFestro</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500;1,600&family=Jost:wght@400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
<div class="auth-page">
    <div class="auth-card">
        <a href="home.html" class="logo"><span class="logo__name">RestoFestro</span><span class="logo__tag">Taste the Traditions of South India</span></a>
        <p class="tagline">Welcome back. Log in to order.</p>

        <form action="login" method="post" onsubmit="return validateLoginForm()">
            <label>Email</label>
            <input type="email" id="email" name="email" required>

            <label>Password</label>
            <input type="password" id="password" name="password" required>

            <p id="errorMsg" class="error-msg"></p>

            <button type="submit" class="btn btn--gold">Login</button>
        </form>

        <p class="auth-footer">New here? <a href="register.html">Create an account</a></p>
    </div>
</div>
<script src="js/login.js"></script>
</body>
</html>
